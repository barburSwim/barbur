<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>ברבור — הזמנת שיעור פרטי (TEST)</title>
<style>
:root { --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --muted:#5b6674; --line:#dfe4ea; --acc:#0b6bcb; --acc-soft:#e6f0fb; --acc-ink:#fff; --warn:#a15c00; --warn-bg:#fff4e5; --bad:#b42318; --bad-bg:#fdecea; --ok:#1f7a3f; --ok-bg:#e8f5ee; --r:12px; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.4; }
header.top { background:var(--acc); color:var(--acc-ink); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; position:sticky; top:0; z-index:5; }
header.top .brand { font-weight:700; font-size:17px; }
header.top .sub { font-size:13px; opacity:.85; font-weight:400; }
header.top button { background:transparent; color:var(--acc-ink); border:1px solid rgba(255,255,255,.55); border-radius:8px; padding:5px 10px; font-size:14px; cursor:pointer; }
main { max-width:560px; margin:0 auto; padding:16px; }
main.wide { max-width:1100px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; }
.card h2 { font-size:17px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.card h3 { font-size:15px; margin:12px 0 6px; }
label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
input, select, textarea { width:100%; font:inherit; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
input[type=time], input[type=date] { width:auto; min-width:0; }
input[type=checkbox] { width:auto; transform:scale(1.2); margin:0 0 0 6px; vertical-align:middle; }
.btn { display:inline-block; font:inherit; font-size:15px; padding:9px 14px; border-radius:9px; border:1px solid var(--acc); background:var(--acc); color:var(--acc-ink); cursor:pointer; text-decoration:none; text-align:center; }
.btn.sec { background:#fff; color:var(--acc); }
.btn.ghost { background:transparent; border-color:var(--line); color:var(--ink); }
.btn.danger { background:#fff; border-color:var(--bad); color:var(--bad); }
.btn.sm { font-size:13px; padding:5px 10px; border-radius:7px; }
.btn.block { display:block; width:100%; margin-top:12px; padding:12px; }
.btn[disabled] { opacity:.5; cursor:default; }
.link { background:none; border:0; color:var(--acc); padding:0; font:inherit; font-size:15px; cursor:pointer; text-decoration:none; }
.muted { color:var(--muted); font-size:13px; }
.big { font-size:30px; font-weight:700; line-height:1.1; }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
.row:first-of-type { border-top:0; }
.row .grow { flex:1 1 180px; min-width:0; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font:inherit; font-size:15px; cursor:pointer; color:var(--ink); }
.chip.sel { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
.chip[disabled] { opacity:.35; cursor:default; }
.badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--acc-soft); color:var(--acc); white-space:nowrap; }
.badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.bad { background:var(--bad-bg); color:var(--bad); } .badge.gray { background:#eef1f4; color:var(--muted); }
.msg { padding:10px 12px; border-radius:9px; margin-bottom:12px; font-size:15px; }
.msg.err { background:var(--bad-bg); color:var(--bad); } .msg.ok { background:var(--ok-bg); color:var(--ok); } .msg.warn { background:var(--warn-bg); color:var(--warn); } .msg.info { background:var(--acc-soft); color:var(--acc); }
.hidden { display:none !important; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tabs button { font:inherit; font-size:14px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
.tabs button.on { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:700px) { .grid2 { grid-template-columns:1fr; } }
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
.kv b { font-weight:600; }
.week { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.day { border:1px solid var(--line); border-radius:10px; padding:8px 2px; text-align:center; background:#fff; cursor:pointer; font:inherit; }
.day .d { font-size:12px; color:var(--muted); } .day .n { font-size:17px; font-weight:600; } .day .c { font-size:11px; color:var(--acc); }
.day.sel { background:var(--acc); color:#fff; } .day.sel .d, .day.sel .c { color:#fff; opacity:.9; }
.day[disabled] { opacity:.35; cursor:default; }
.nav { display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px; }
.range { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:4px 0; }
.range .link { font-size:13px; }
.range input[type=time] { padding:6px 8px; font-size:14px; }
.wrow { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); }
.wrow:first-of-type { border-top:0; }
.wrow .wd { width:88px; font-weight:600; padding-top:6px; }
.wrow .wr { flex:1; }
.empty { color:var(--muted); font-size:14px; padding:8px 0; }
.inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.inline > * { margin:0; }
details summary { cursor:pointer; color:var(--acc); font-size:15px; margin:8px 0; }
.stat { display:flex; gap:12px; flex-wrap:wrap; }
.stat .card { flex:1 1 140px; margin:0; padding:12px; }
.stat .n { font-size:26px; font-weight:700; } .stat .l { font-size:13px; color:var(--muted); }
.sheet { position:fixed; inset:0; background:rgba(20,30,40,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
.sheet .card { width:100%; max-width:560px; max-height:85vh; overflow:auto; border-radius:16px 16px 0 0; margin:0; }
@media (min-width:700px) { .sheet { align-items:center; } .sheet .card { border-radius:16px; } }
.testbar { background:var(--warn-bg); color:var(--warn); font-size:12px; text-align:center; padding:3px; }
.sw { display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; color:var(--ink); font-size:15px; margin:0; }
.range select { width:auto; padding:6px 8px; font-size:14px; }
.range .rerr:empty { display:none; }
.range .rerr { flex-basis:100%; font-size:12px; }
.day.sk { background:linear-gradient(90deg,#eef1f4,#f6f8fa,#eef1f4); background-size:200% 100%; animation:sk 1.2s linear infinite; border-color:transparent; }
@keyframes sk { from { background-position:200% 0; } to { background-position:-200% 0; } }
.skel { height:14px; border-radius:6px; background:linear-gradient(90deg,#eef1f4,#f6f8fa,#eef1f4); background-size:200% 100%; animation:sk 1.2s linear infinite; margin:6px 0; }
.tgroup { margin:8px 0; } .tgroup .tl { font-size:12px; color:var(--muted); margin-bottom:4px; }
.wa { display:inline-flex; align-items:center; gap:6px; color:var(--ok); text-decoration:none; font-weight:600; }
.tel { display:inline-flex; align-items:center; gap:6px; color:var(--acc); text-decoration:none; font-weight:600; }
.hero { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; }
.steps { display:flex; gap:6px; margin-bottom:10px; } .steps span { flex:1; height:4px; border-radius:2px; background:var(--line); } .steps span.on { background:var(--acc); }

/* Responsive UI (2026-10-23): pending control, progress bar after 1 s, optimistic row ("שומר…") */
.ux-pending { cursor:progress !important; }
.btn.ux-pending { opacity:.75; }
a.ux-pending { pointer-events:none; opacity:.7; }
.tabs .ux-pending { opacity:.75; }
.uxbar { position:fixed; top:0; left:0; right:0; z-index:50; display:none; padding:4px 12px 0; font-size:13px; text-align:center; color:var(--acc); background:var(--acc-soft); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.uxbar.on { display:block; }
.uxbar::after { content:''; display:block; height:3px; margin-top:4px; background:linear-gradient(90deg,transparent,var(--acc),transparent); background-size:200% 100%; animation:sk 1.1s linear infinite; }
.row.ux-ghost { opacity:.75; }
.row.ux-ghost.ux-saved { opacity:1; }

/* Iteration 2.3: report table + highlighted stat tile */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th, .tbl td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top; white-space:nowrap; }
.tbl th { color:var(--muted); font-weight:600; background:var(--bg); position:sticky; top:0; }
.tbl tr.rep td:first-child { border-right:3px solid var(--ok); }
.stat .card.hl { border:2px solid var(--ok); }

</style>
</head>
<body>
<header class="top"><div class="brand">ברבור — שיעורים פרטיים</div><button id="logoutBtn" class="hidden" onclick="logout()">התנתק</button></header>
<div class="testbar hidden" id="testbar">סביבת בדיקה (TEST)</div>
<main>
  <div id="msg"></div>

  <section id="login" class="card hidden">
    <h2>כניסה</h2>
    <p class="muted">הכניסה למשפחות רשומות בלבד. נשלח קוד לאימייל.</p>
    <label for="email">אימייל</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <button class="btn block" id="sendBtn" onclick="sendCode()">שליחת קוד</button>
    <div id="codeBox" class="hidden">
      <label for="code">קוד בן 6 ספרות</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button class="btn block" onclick="verify()">כניסה</button>
    </div>
    <div class="muted" id="loginContacts" style="margin-top:12px"></div>
  </section>

  <section id="home" class="hidden">
    <div class="card">
      <div class="hero"><div><div class="muted" id="hhName"></div><div class="big" id="balance"></div><div class="muted" id="expiry"></div></div></div>
      <div class="muted" id="studentsLine" style="margin-top:6px"></div>
      <button class="btn block" id="bookStart" onclick="startBooking()">הזמנת שיעור</button>
      <div class="muted" id="noCoach" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>השיעורים הקרובים</h2>
      <div id="upcoming"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
    </div>
    <div class="card" id="officeCard"><h2>המזכירות</h2><div class="muted">ביטול פחות מ־<span id="lateH"></span> שעות לפני השיעור, שינויים ורכישת שיעורים — דרך המזכירות.</div><div id="officeContact" style="margin-top:6px"></div></div>
  </section>

  <section id="book" class="hidden">
    <div class="card">
      <button class="link" onclick="showHome()">→ חזרה</button>
      <div class="steps" id="steps"><span class="on"></span><span></span><span></span><span></span></div>
      <h2 id="bookTitle">הזמנת שיעור</h2>
      <div id="stStudent"><label>שחיין/ית</label><div class="chips" id="studentChips"></div></div>
      <div id="picker" class="hidden">
        <div class="muted" id="coachLine" style="margin:6px 0"></div>
        <label>יום</label>
        <div class="nav"><button class="btn sm ghost" id="prevW" onclick="moveWeek(-1)">→ שבוע קודם</button><span class="muted" id="weekLbl"></span><button class="btn sm ghost" id="nextW" onclick="moveWeek(1)">שבוע הבא ←</button></div>
        <div class="week" id="week"></div>
        <div class="muted" id="dayHint" style="margin-top:6px"></div>
        <div id="timesBox" class="hidden"><label>שעה</label><div id="timeChips"></div></div>
      </div>
    </div>
    <div class="card hidden" id="review">
      <h2>אישור ההזמנה</h2>
      <div class="kv" id="reviewKv"></div>
      <p class="muted" id="reviewNote"></p>
      <div id="sameDayBox" class="hidden"></div>
      <button class="btn block" id="confirmBtn" onclick="confirmBooking()">אישור הזמנה</button>
    </div>
  </section>
</main>
<script>
var S = { token:null, email:'', home:null, student:null, weeks:{}, day:null, slot:null, busy:false, weekStart:null, from:null, to:null };
var DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'], DS = ['א','ב','ג','ד','ה','ו','ש'];

// Navigation contains identifiers only, scoped to this session; no tokens, names or drafts.
function navKey(){ var h=2166136261, t=String(S.token||''); for(var i=0;i<t.length;i++) h=Math.imul(h^t.charCodeAt(i),16777619); return 'bbNav:customer:'+ (h>>>0); }
function readNav(){ try { var r=JSON.parse(sessionStorage.getItem(navKey())||'null'); return r && r.v===1 && Date.now()-r.at<43200000 ? r : null; } catch(e){ return null; } }
function writeNav(r){ if(!S.token) return; try { r.v=1; r.at=Date.now(); sessionStorage.setItem(navKey(),JSON.stringify(r)); } catch(e){} }
function clearNav(){ try { sessionStorage.removeItem(navKey()); } catch(e){} }
function navDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d||'') && !isNaN(Date.parse(d)) && new Date(d).toISOString().slice(0,10)===d; }

function $(id){ return document.getElementById(id); }
function show(id){ if(id==='login' && !S.contacts) loadPublicInfo(); S.screen=id; if(id!=='login') saveCustomerNav(); ['login','home','book'].forEach(function(x){ $(x).classList.toggle('hidden', x!==id); }); $('logoutBtn').classList.toggle('hidden', id==='login'); window.scrollTo(0,0); }
function msg(t, kind){ UX.seq++; $('msg').innerHTML = t ? '<div class="msg '+(kind||'err')+'">'+esc(t)+'</div>' : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function store(k,v){ try { if (v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
/*UX_START*/
// Responsive UI (owner 2026-10-23, "feels instant"). ONE layer around every server call of this page: call() is its only user, and
// the same block is in Office, Coach, Customer and Leads (test/ux.test.js keeps the copies identical). Server behaviour is unchanged.
// - The control that started the call (clicked, or Enter pressed in it, in the same browser event) shows a pending state at once:
//   disabled, aria-busy, the action's text ("מתבצע…" by default). It comes back when the answer arrives, success or error.
// - The same write is never in flight twice: a second click, Enter or re-sent form sends nothing and says so.
// - A thin progress bar with the action's text appears after 1 s; at once when the control is gone (a form that closed on אישור).
// - opt.ghost shows the new row at once, marked "שומר…". On success it is marked "נשמר" until the list re-renders with the real
//   row; on any failure it is removed at once and the caller's red error is shown — never a row the server did not create.
// - A write started by the user whose own code shows no message ends with a green "בוצע". opt.quiet = background call, no bar.
var UX = { seq: 0, live: [], writes: {}, trig: null, trigAt: 0, trigWas: null, bar: null, timer: null, log: [] };
var UX_READ = /^(off_(bootstrap|home|search|household|householdAudit|slots|readExceptions|groups|groupDetail|groupReviews|closures|leads|lead|policies|coachReport|coachAnnual|coachReportCsv|previewGroupEdit|syncPlatform)|co_(schedule|week|calendars|recentChanges|preview)|api_(home|slots|publicInfo|leadForm|coachPageInfo)|st_me)$/;
// Calls that carry a password or a one-time secret: de-duplicated by function name only, so the secret is never kept in a key.
var UX_SECRET = /^(st_officeLogin|st_officeWebLogin|st_platformLogin|st_redeemInvitation|api_verifyOtp|off_setTestPassword|off_deleteCoach|off_exceptions|off_adminRun)$/;
var UX_TEXT = { off_inviteCoach: 'שולח הזמנה…', off_coachReport: 'מכין דוח…', off_coachAnnual: 'מכין דוח…', off_coachReportCsv: 'מכין קובץ CSV…',
  off_refreshCache: 'מרענן נתונים…', off_exceptions: 'בודק מול היומן…', off_adminRun: 'הפעולה רצה — עד כמה דקות…', off_createFamily: 'יוצר משפחה…',
  off_convertLead: 'יוצר כרטיסייה…', off_addGrant: 'רושם כרטיסייה…', off_book: 'קובע שיעור…', off_cancel: 'מבטל…', off_reschedule: 'משנה מועד…',
  off_createBookingCalendar: 'יוצר יומן…', off_shareBookingCalendar: 'משתף יומן…', off_unlinkPlatformCoach: 'מנתק…', off_deleteCoach: 'מוחק…',
  off_revokeInvitation: 'מבטל הזמנה…', off_saveGroup: 'שומר ומשבץ מפגשים…', off_editGroupFrom: 'מעדכן מפגשים…', off_setConfig: 'מעדכן…',
  api_book: 'קובע שיעור…', api_reschedule: 'משנה מועד…', api_cancel: 'מבטל…', api_requestOtp: 'שולח קוד…', api_verifyOtp: 'מאמת…',
  api_submitLead: 'שולח…', st_officeLogin: 'נכנס…', st_officeWebLogin: 'נכנס…', st_platformLogin: 'נכנס…', st_redeemInvitation: 'מחבר…',
  co_saveRules: 'שומר…', co_saveOverride: 'שומר…', co_saveSettings: 'שומר…', co_cancel: 'מבטל…', co_reschedule: 'משנה מועד…', co_noShow: 'מסמן…' };
function uxMark(e){ var t = e.target, el = t && t.closest ? t.closest('button,a,input,select,textarea') : null; UX.trig = el; UX.trigAt = performance.now(); UX.trigWas = el && { disabled: el.disabled, html: el.innerHTML }; setTimeout(function(){ if (UX.trig === el) UX.trig = null; }, 0); }
document.addEventListener('click', uxMark, true);
document.addEventListener('keydown', function(e){ if (e.key === 'Enter') uxMark(e); }, true);
function uxKey(args){ try { return JSON.stringify(args, function(k, v){ return k === 'request_id' ? undefined : v; }); } catch (e) { return String(Math.random()); } }
function uxShown(el){ return !!(el && el.isConnected && el.getClientRects().length); }
/** Start of a server call. Returns the call handle, or null when the same write is already on its way (then nothing is sent). */
function uxStart(fn, args, opt){
  opt = opt || {};
  var write = !UX_READ.test(fn), key = fn + '|' + (UX_SECRET.test(fn) ? '' : uxKey(args));
  if (write && UX.writes[key]) { msg('הפעולה כבר נשלחה ומתבצעת — המתינו לתשובה', 'warn'); return null; }
  var el = UX.trig, shown = uxShown(el);
  var h = { fn: fn, write: write, key: key, seq: UX.seq, from: el, user: !!el && !opt.quiet, quiet: !!opt.quiet, text: UX_TEXT[fn] || (write ? 'מתבצע…' : 'טוען…'), t0: performance.now(), ev: el ? UX.trigAt : 0 };
  UX.trig = null; // one call per user action owns the control
  if (write) UX.writes[key] = h;
  if (shown && !el.disabled && !el.readOnly) { h.el = el; uxPend(el, h.text); }
  else if (el && el.disabled && UX.trigWas && !UX.trigWas.disabled) h.own = { el: el, html: UX.trigWas.html }; // the page set its own pending state: give the control back on every outcome
  if (opt.ghost) h.ghost = uxGhost(opt.ghost);
  UX.live.push(h); uxBar(h.user && !shown && !h.ghost ? 0 : 1000);
  if (h.ev) requestAnimationFrame(function(){ h.fb = Math.round(performance.now() - h.ev); });
  return h;
}
function uxPend(el, text){
  el.setAttribute('aria-busy', 'true'); el.classList.add('ux-pending');
  if (el.closest('.tabs')) return; // a tab only shows that it is loading; switching tabs stays possible
  if (el.tagName === 'BUTTON' || (el.tagName === 'INPUT' && /^(button|submit)$/.test(el.type))) {
    el.disabled = true;
    if (el.classList.contains('btn')) { el.style.minWidth = el.offsetWidth + 'px'; el.setAttribute('data-ux-label', el.innerHTML); el.textContent = text; }
  } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.readOnly = true;
}
function uxRestore(el){
  el.removeAttribute('aria-busy'); el.classList.remove('ux-pending');
  if (el.closest('.tabs')) return;
  var l = el.getAttribute('data-ux-label'); if (l != null) { el.innerHTML = l; el.removeAttribute('data-ux-label'); el.style.minWidth = ''; }
  if (el.tagName === 'BUTTON' || (el.tagName === 'INPUT' && /^(button|submit)$/.test(el.type))) el.disabled = false;
  else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.readOnly = false;
}
/** Optimistic row: g = { into: element id or element, after: selector inside it (optional), label: text }. */
function uxGhost(g){

}
function pickTime(el){
  Array.prototype.forEach.call($('timeChips').querySelectorAll('.chip'), function(c){ c.classList.toggle('sel', c===el); });
  S.slot = { start: el.getAttribute('data-start'), hm: el.getAttribute('data-hm'), ymd: el.getAttribute('data-ymd') }; step(3);
  var st = S.home.students.filter(function(x){ return x.student_id===S.student; })[0], bal = st.balance.usable;
  var dl = cancelUntil(S.slot.start, S.home.late_hours), dlYmd = dl.ymd, dlHm = dl.hm;
  var rows = S.resched
    ? [['שחיין/ית', st.first_name], ['מועד נוכחי', fmtDay(S.resched.ymd) + ' ' + S.resched.hm], ['מועד חדש', fmtDay(S.slot.ymd) + ' ' + S.slot.hm], ['מאמן/ת', st.coach_name], ['מיקום', st.location], ['יתרה', 'ללא שינוי (' + bal + ' שיעורים)'], ['ביטול ללא חיוב', 'עד ' + fmtDay(dlYmd) + ' ' + dlHm]]
    : [['שחיין/ית', st.first_name], ['מאמן/ת', st.coach_name], ['תאריך', fmtDay(S.slot.ymd)], ['שעה', S.slot.hm], ['משך', st.lesson_minutes + ' דקות (' + st.lesson_name + ')'], ['מיקום', st.location], ['יתרה', bal + ' → ' + (bal - 1) + ' שיעורים'], ['ביטול ללא חיוב', 'עד ' + fmtDay(dlYmd) + ' ' + dlHm]];
  $('reviewKv').innerHTML = rows.map(function(p){ return '<b>' + esc(p[0]) + '</b><span>' + esc(p[1]) + '</span>'; }).join('');
  $('review').querySelector('h2').textContent = S.resched ? 'אישור שינוי מועד' : 'אישור ההזמנה';
  $('confirmBtn').textContent = S.resched ? 'אישור שינוי מועד' : 'אישור הזמנה';
  $('reviewNote').textContent = 'ביטול פחות מ־' + S.home.late_hours + ' שעות לפני השיעור מחויב במלואו ונעשה דרך המזכירות.';
  S.sameDayOk = false; $('sameDayBox').classList.add('hidden'); $('confirmBtn').classList.remove('hidden');
  $('review').classList.remove('hidden'); S.req = uuid(); $('review').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
/** Part 3 (owner 2026-10-23): the swimmer's existing lesson on that date, if any (the server accepts a second one after the parent confirms). */
function sameDayLesson(studentId, ymd){ return (S.home.upcoming || []).filter(function(b){ return b.student_id === studentId && b.ymd === ymd && (b.status === 'CONFIRMED' || b.status === 'PENDING'); })[0] || null; }
function askSameDay(b){
  $('sameDayBox').innerHTML = '<div class="msg warn"><div id="sameDayQ">' + esc('כבר יש ל-' + b.student + ' שיעור ב-' + fmtDM(b.ymd) + ' בשעה ' + b.hm + '. להזמין שיעור נוסף באותו יום?') + '</div>' +
    '<div class="inline" style="margin-top:8px"><button class="btn sm" id="sameDayYes" onclick="sameDayYes()">כן, להזמין</button><button class="btn sm sec" id="sameDayNo" onclick="sameDayNo()">ביטול</button></div></div>';
  $('sameDayBox').classList.remove('hidden'); $('confirmBtn').classList.add('hidden'); $('sameDayYes').focus();
}
function sameDayYes(){ S.sameDayOk = true; $('sameDayBox').classList.add('hidden'); $('confirmBtn').classList.remove('hidden'); confirmBooking(); }
function sameDayNo(){ $('sameDayBox').classList.add('hidden'); $('confirmBtn').classList.remove('hidden'); $('review').classList.add('hidden'); $('timesBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
function confirmBooking(){
  if (S.bookingPending) return;
  if (!S.resched && !S.sameDayOk) { var same = sameDayLesson(S.student, S.slot.ymd); if (same) { askSameDay(same); return; } }
  S.bookingPending = true;
  if (S.resched) return confirmResched();
  $('confirmBtn').disabled = true; $('confirmBtn').textContent = 'קובע…';
  var st = S.home.students.filter(function(x){ return x.student_id===S.student; })[0], back = function(){ $('confirmBtn').disabled = false; $('confirmBtn').textContent = 'אישור הזמנה'; renderHome(); show('book'); $('review').scrollIntoView({ block: 'start' }); };
  show('home'); msg(''); $('bookStart').disabled = true;
  call('api_book', [S.token, { request_id: S.req, student_id: S.student, start: S.slot.start }], function(res){
    S.bookingPending = false;
    $('confirmBtn').disabled = false; $('confirmBtn').textContent = 'אישור הזמנה';
    if (!res.ok) { back(); msg(res.message); if (res.code==='SLOT_TAKEN') { invalidateWeeks(); loadWeek(S.weekStart); } return; }
    applyBooked(res.data); msg('השיעור נקבע! אישור נשלח באימייל.', 'ok');
    if (applyBalances(res.data.balances)) { renderHome(); show('home'); }
    else refresh(function(){ msg('השיעור נקבע! אישור נשלח באימייל.', 'ok'); }); // compatibility with older TEST backends
  }, { ghost: { into: 'upcoming', label: (st ? st.first_name + ' · ' : '') + fmtDay(S.slot.ymd) + ' ' + S.slot.hm }, fail: function(){ renderHome(); $('confirmBtn').textContent = 'אישור הזמנה'; } });
}
function confirmResched(){
  $('confirmBtn').disabled = true; $('confirmBtn').textContent = 'מעדכן…';
  call('api_reschedule', [S.token, S.resched.booking_id, S.slot.start], function(res){
    S.bookingPending = false;
    $('confirmBtn').disabled = false; $('confirmBtn').textContent = 'אישור שינוי מועד';
    if (!res.ok) { msg(res.message); if (res.code==='SLOT_TAKEN') { invalidateWeeks(); loadWeek(S.weekStart); } if (res.code==='LATE') { S.resched = null; refresh(); } return; }
    S.resched = null; applyBooked(res.data, true); msg('המועד שונה ל-' + fmtDay(res.data.ymd) + ' ' + res.data.hm + '. אישור נשלח באימייל.', 'ok');
    if (applyBalances(res.data.balances)) { renderHome(); show('home'); }
    else refresh(function(){ msg('המועד שונה ל-' + fmtDay(res.data.ymd) + ' ' + res.data.hm + '. אישור נשלח באימייל.', 'ok'); });
  });
}


function saveCustomerNav(){ if(!S.home) return; writeNav({screen:S.screen==='book'?'book':'home',student:S.student||null,week:S.weekStart||null,date:S.day||null,reschedule:S.resched&&S.resched.booking_id||null}); }
function restoreCustomerNav(r){
  if(r.screen!=='book') return;
  var st=S.home.students.filter(function(x){return x.student_id===r.student})[0];
  if(!st || !st.bookable) return;
  if(r.reschedule){ var b=S.home.upcoming.filter(function(x){return x.booking_id===r.reschedule&&x.can_reschedule})[0]; if(!b) return; S.restoringBooking=r; startResched(b.booking_id); }
  else { if(!st.balance || st.balance.usable<=0) return; S.restoringBooking=r; startBooking(); if(S.student!==st.student_id) { var el=$('studentChips').querySelector('[data-id="'+st.student_id+'"]'); if(el) pickStudent(el); } }
}

(function init(){ S.token = load('bbTok'); if (S.token) refresh(null, true); else show('login'); })();
</script>
